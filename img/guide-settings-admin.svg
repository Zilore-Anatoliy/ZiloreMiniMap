<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Настройки Windows 11, темы, бэкап и окно профиля игрока для админов">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#08101C"/><stop offset="100%" stop-color="#11243E"/></linearGradient>
    <linearGradient id="c6" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#132136"/><stop offset="100%" stop-color="#0B1422"/></linearGradient>
  </defs>
  <rect x="8" y="8" width="784" height="384" rx="18" fill="url(#bg6)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Left: Settings Fluent Window -->
  <rect x="28" y="28" width="372" height="344" rx="14" fill="url(#c6)" stroke="#38BDF8" stroke-opacity="0.35"/>
  <text x="48" y="56" fill="#F8FAFC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="700">⚙ Настройки и темы Windows 11</text>
  <!-- Theme swatches -->
  <text x="48" y="82" fill="#94A3B8" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">4 ЖИВЫЕ ТЕМЫ (БЕЗ ПЕРЕЗАПУСКА):</text>
  <rect x="48" y="92" width="76" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="86" y="113" fill="#7DD3FC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Системная</text>
  <rect x="132" y="92" width="72" height="34" rx="8" fill="#0E1624" stroke="#475569"/>
  <text x="168" y="113" fill="#E2E8F0" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle">Тёмная</text>
  <rect x="212" y="92" width="68" height="34" rx="8" fill="#000000" stroke="#475569"/>
  <text x="246" y="113" fill="#FFFFFF" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11" text-anchor="middle">OLED</text>
  <rect x="288" y="92" width="92" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="334" y="113" fill="#0F172A" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Светлая</text>

  <!-- Setting rows -->
  <rect x="48" y="142" width="332" height="44" rx="9" fill="#0B1422" stroke="#334155"/>
  <text x="62" y="162" fill="#F8FAFC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Аппаратное ускорение карты (GPU)</text>
  <text x="62" y="177" fill="#94A3B8" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10">Рекомендуется для 2K / 4K 144 Гц</text>
  <rect x="334" y="155" width="34" height="18" rx="9" fill="#22C55E"/><circle cx="359" cy="164" r="6" fill="#FFFFFF"/>

  <rect x="48" y="196" width="332" height="44" rx="9" fill="#0B1422" stroke="#334155"/>
  <text x="62" y="216" fill="#F8FAFC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Автозапуск вместе с SCUM</text>
  <text x="62" y="231" fill="#94A3B8" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10">Автооткрытие и закрытие с игрой</text>
  <rect x="334" y="209" width="34" height="18" rx="9" fill="#22C55E"/><circle cx="359" cy="218" r="6" fill="#FFFFFF"/>

  <rect x="48" y="250" width="332" height="44" rx="9" fill="#0B1422" stroke="#334155"/>
  <text x="62" y="270" fill="#F8FAFC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Бэкап профиля (ZIP) и EULA</text>
  <text x="62" y="285" fill="#94A3B8" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10">Сохраняет все точки, зоны и маршруты</text>
  <rect x="308" y="260" width="60" height="24" rx="6" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8"/>
  <text x="338" y="276" fill="#7DD3FC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Бэкап</text>

  <text x="48" y="324" fill="#B4C3D6" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11">Шрифт Segoe UI Variable + ClearType во всех</text>
  <text x="48" y="342" fill="#B4C3D6" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11">окнах и оверлеях на масштабе 100–200% DPI.</text>

  <!-- Right: Admin Player Profile Window (Pure WPF) -->
  <rect x="416" y="28" width="356" height="344" rx="14" fill="url(#c6)" stroke="#F59E0B" stroke-opacity="0.4"/>
  <text x="436" y="56" fill="#F8FAFC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="700">🛡 Админ-инструменты и профиль</text>
  <!-- Player header -->
  <rect x="436" y="72" width="316" height="62" rx="10" fill="#0B1422" stroke="#38BDF8" stroke-opacity="0.4"/>
  <text x="450" y="95" fill="#F8FAFC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Survivor_Alpha</text>
  <text x="450" y="113" fill="#94A3B8" font-family="Cascadia Code, Consolas, monospace" font-size="10">SteamID: 76561198012345678</text>
  <rect x="656" y="84" width="84" height="24" rx="6" fill="#0EA5E9"/>
  <text x="698" y="100" fill="#031523" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Телепорт</text>

  <!-- Tabs -->
  <rect x="436" y="146" width="72" height="24" rx="6" fill="#38BDF8" fill-opacity="0.22" stroke="#38BDF8"/>
  <text x="472" y="162" fill="#7DD3FC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Обзор</text>
  <rect x="514" y="146" width="82" height="24" rx="6" fill="#1E293B"/>
  <text x="555" y="162" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" text-anchor="middle">Транспорт</text>
  <rect x="602" y="146" width="68" height="24" rx="6" fill="#1E293B"/>
  <text x="636" y="162" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" text-anchor="middle">Флаги</text>
  <rect x="676" y="146" width="76" height="24" rx="6" fill="#1E293B"/>
  <text x="714" y="162" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" text-anchor="middle">Отряд</text>

  <rect x="436" y="180" width="316" height="108" rx="10" fill="#070E1A" stroke="#334155"/>
  <text x="450" y="204" fill="#E2E8F0" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11.5">• Транспорт: 2 · Флаги: 1 · Отряд: GRAND</text>
  <text x="450" y="226" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11.5">• Импорт из буфера обмена в 1 клик</text>
  <text x="450" y="248" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11.5">• Показ техники и флагов прямо на карте</text>
  <text x="450" y="270" fill="#FDE68A" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11.5">• Корзина спавна (Spawn Cart) + наборы</text>

  <text x="436" y="320" fill="#94A3B8" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11">Админ-модуль отключён по умолчанию и</text>
  <text x="436" y="338" fill="#94A3B8" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11">защищён паролем. Работает только локально.</text>
</svg>
