  <rect x="46" y="322" width="32" height="18" rx="5" fill="#38BDF8" fill-opacity="0.22" stroke="#38BDF8"/>
  <text x="62" y="335" fill="#7DD3FC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">C2</text>
  <text x="86" y="335" fill="#F8FAFC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="600">Около Самобора</text>
  <text x="46" y="357" fill="#22D3EE" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">↱ 85 м · → Бункер B3 · 1.2 км</text>
  <text x="46" y="376" fill="#FBBF24" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600">☀ 14:32 · 18°C</text>
