<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Интерфейс круглой миникарты HUD и тактической карты ZiloreMiniMap">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#070E1A"/><stop offset="100%" stop-color="#122640"/></linearGradient>
    <radialGradient id="rad2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/><stop offset="100%" stop-color="#070E1A" stop-opacity="0"/></radialGradient>
    <clipPath id="rc2"><circle cx="152" cy="186" r="106"/></clipPath>
  </defs>
  <rect x="8" y="8" width="784" height="424" rx="18" fill="url(#bg2)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Left: Circular HUD Minimap -->
  <text x="152" y="46" fill="#7DD3FC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">МИНИКАРТА (HUD)</text>
  <circle cx="152" cy="186" r="112" fill="#08101C" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="152" cy="186" r="106" fill="url(#rad2)"/>
  <g clip-path="url(#rc2)">
    <g stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1">
      <circle cx="152" cy="186" r="36" fill="none"/><circle cx="152" cy="186" r="72" fill="none"/>
      <line x1="46" y1="186" x2="258" y2="186"/><line x1="152" y1="80" x2="152" y2="292"/>
    </g>
    <!-- Road route line -->
    <path d="M 152 186 Q 170 154 206 132" fill="none" stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Player cone + marker -->
    <path d="M 152 186 L 136 142 A 46 46 0 0 1 168 142 Z" fill="#FBBF24" fill-opacity="0.28"/>
    <circle cx="152" cy="186" r="6" fill="#FBBF24" stroke="#08101C" stroke-width="2"/>
    <!-- Squadmate -->
    <circle cx="110" cy="150" r="5" fill="#4ADE80" stroke="#08101C" stroke-width="1.5"/>
    <text x="96" y="140" fill="#DCFCE7" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">Alex</text>
  </g>
  <text x="152" y="92" fill="#FB7185" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">N</text>
  <text x="152" y="287" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">S</text>
  <text x="55" y="190" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">W</text>
  <text x="249" y="190" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">E</text>

  <!-- HUD Status Bar -->
