  <text x="330" y="95" fill="#94A3B8" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="700">ЦЕЛЬ · B3</text>
  <text x="330" y="114" fill="#F8FAFC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Бункер B3</text>
  <text x="330" y="131" fill="#22D3EE" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5">1.2 км по дорогам · ~2 мин</text>
