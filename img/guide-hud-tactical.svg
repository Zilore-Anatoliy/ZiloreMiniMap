  <rect x="626" y="96" width="132" height="24" rx="6" fill="#080F1B" stroke="#475569"/>
  <text x="634" y="112" fill="#64748B" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10">Поиск меток…</text>
  <text x="628" y="140" fill="#7DD3FC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700">☑ Бункеры (18)</text>
  <text x="628" y="160" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5">☑ Торговцы (4)</text>
  <text x="628" y="180" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5">☑ Заправки (24)</text>
  <text x="628" y="200" fill="#CBD5E1" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5">☑ Полиция (32)</text>
  <text x="628" y="220" fill="#94A3B8" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5">☐ Охота / Рыбалка</text>
  <line x1="626" y1="236" x2="758" y2="236" stroke="#334155"/>
  <text x="628" y="256" fill="#F8FAFC" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">Прозрачность</text>
  <rect x="626" y="266" width="132" height="6" rx="3" fill="#1E293B"/>
  <rect x="626" y="266" width="98" height="6" rx="3" fill="#38BDF8"/>
  <circle cx="724" cy="269" r="6" fill="#E0F2FE"/>
  <rect x="626" y="294" width="132" height="26" rx="7" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8"/>
