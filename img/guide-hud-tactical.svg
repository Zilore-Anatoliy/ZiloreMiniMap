  <rect x="626" y="328" width="132" height="26" rx="7" fill="#1E293B" stroke="#475569"/>
  <text x="692" y="345" fill="#E2E8F0" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">⚙ Настройки</text>
  <rect x="626" y="362" width="132" height="26" rx="7" fill="#1E293B" stroke="#475569"/>
  <text x="692" y="379" fill="#E2E8F0" font-family="Segoe UI Variable, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">📘 Справка (F1)</text>
